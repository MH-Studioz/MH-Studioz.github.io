<!doctype html>
<html>
  <body>
    <script type="module">
      import * as THREE from 'three';
      import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js';
      import { GLTFExporter } from 'three/examples/jsm/exporters/GLTFExporter.js';
      import { MeshoptDecoder } from 'three/examples/jsm/libs/meshopt_decoder.module.js';

      const WHEELISH = /wheel|rims|\brim\b|tyre|tire|neumatic|rueda|llanta|roues|cerchione|felge|pneu/i;
      const CORNERS = [
        { key: 'lf', sx: -1, sz: 1 },
        { key: 'rf', sx: 1, sz: 1 },
        { key: 'lr', sx: -1, sz: -1 },
        { key: 'rr', sx: 1, sz: -1 },
      ];
      /**
       * Scans that get the envelope sweep as well as the tyre seed. The GT's tyre
       * is one mesh while its rims, hubs and rotors are separate body meshes in
       * the same wheel volume, so the seed alone would leave the spokes standing
       * still. The Rally's four wheel nodes already carry tyre, rim and rotor, so
       * the sweep finds nothing there and the split is unchanged.
       */
      const ENVELOPE_SWEEP = new Map([
        ['gt_mustang.glb', 'triangles'],
        ['rally_yaris.glb', 'triangles'],
        // The junior's brake disc and hub sit inside the tyre while its suspension
        // arms pass through it. Taking whole parts only (every triangle inside an
        // envelope) turns the disc without tearing a few triangles out of an arm.
        ['junior_f4.glb', 'whole'],
        // The hypercar's brake discs sit in the wheel wells as separate meshes;
        // its springs and arms cross the envelope, so they are left alone.
        ['hypercar_kralz.glb', 'whole'],
      ]);

      const labelOf = (mesh) => {
        const names = [mesh.name];
        let cur = mesh;
        for (let i = 0; i < 5 && cur; i += 1) {
          names.push(cur.name);
          cur = cur.parent;
        }
        return names.join(' ');
      };

      function toBase64(buffer) {
        const bytes = new Uint8Array(buffer);
        let binary = '';
        const chunk = 0x8000;
        for (let i = 0; i < bytes.length; i += chunk) {
          binary += String.fromCharCode(...bytes.subarray(i, i + chunk));
        }
        return btoa(binary);
      }

      window.__split = async (file) => {
        const loader = new GLTFLoader();
        loader.setMeshoptDecoder(MeshoptDecoder);
        const gltf = await loader.loadAsync(`/assets/models/cars/${file}`);
        const model = gltf.scene;
        model.updateMatrixWorld(true);

        // A split scan already carries its four wheel nodes. Splitting it again
        // would nest a second set of wheel-* groups inside the first, which the
        // runtime's bindNamedWheels rejects, so refuse rather than corrupt it.
        const splitNodes = [];
        model.traverse((o) => {
          if (/^wheel-(lf|rf|lr|rr)$/.test(o.name)) splitNodes.push(o.name);
        });
        if (splitNodes.length) {
          throw new Error(`refusing to re-split: already has ${[...new Set(splitNodes)].join(', ')}`);
        }

        const wheelMeshes = [];
        model.traverse((o) => {
          if (o.isMesh && WHEELISH.test(labelOf(o))) wheelMeshes.push(o);
        });

        // Corner gate: a node named like a wheel can still be interior trim (the
        // stock scan names its steering wheel "...STEERING_WHEEL...", and those
        // triangles used to scatter into whichever corner their centroid landed).
        // Only geometry out at a corner belongs to a wheel.
        const carBox = new THREE.Box3();
        const scratch = new THREE.Vector3();
        model.traverse((o) => {
          if (!o.isMesh) return;
          const position = o.geometry.getAttribute('position');
          if (!position) return;
          for (let i = 0; i < position.count; i += 1) carBox.expandByPoint(scratch.fromBufferAttribute(position, i).applyMatrix4(o.matrixWorld));
        });
        const carSize = carBox.getSize(new THREE.Vector3());
        const carLength = Math.max(carSize.x, carSize.z);
        const carWidth = Math.min(carSize.x, carSize.z);

        const body = new THREE.Group();
        body.name = 'body';
        const buckets = Object.fromEntries(CORNERS.map((c) => [c.key, { pos: [], nor: [], centre: null }]));

        // Seed pass: the nodes named like wheels carry the tyre. Their triangles
        // are sorted into the four corners by centroid, because several scans put
        // all four tyres in one mesh. Anything from those nodes that is not at a
        // corner stays with the body: the stock scan's steering wheel is named
        // like a wheel too and used to vanish with the cut.
        for (const mesh of wheelMeshes) {
          const pos = mesh.geometry.getAttribute('position');
          const nor = mesh.geometry.getAttribute('normal');
          const idx = mesh.geometry.index;
          const count = idx ? idx.count : pos.count;
          const a = new THREE.Vector3();
          const b = new THREE.Vector3();
          const c = new THREE.Vector3();
          const keepPos = [];
          const keepNor = [];
          for (let t = 0; t + 2 < count; t += 3) {
            const at = [idx ? idx.getX(t) : t, idx ? idx.getX(t + 1) : t + 1, idx ? idx.getX(t + 2) : t + 2];
            a.fromBufferAttribute(pos, at[0]).applyMatrix4(mesh.matrixWorld);
            b.fromBufferAttribute(pos, at[1]).applyMatrix4(mesh.matrixWorld);
            c.fromBufferAttribute(pos, at[2]).applyMatrix4(mesh.matrixWorld);
            const cx = (a.x + b.x + c.x) / 3;
            const cz = (a.z + b.z + c.z) / 3;
            const atCorner = Math.abs(cx) > carWidth * 0.25 && Math.abs(cz) > carLength * 0.15;
            const corner = atCorner ? CORNERS.find((k) => Math.sign(cx) === k.sx && Math.sign(cz) === k.sz) : undefined;
            const target = corner ? buckets[corner.key] : null;
            const pts = [a, b, c];
            for (let k = 0; k < 3; k += 1) {
              const n = nor ? new THREE.Vector3().fromBufferAttribute(nor, at[k]).transformDirection(mesh.matrixWorld) : null;
              if (target) {
                target.pos.push(pts[k].x, pts[k].y, pts[k].z);
                if (n) target.nor.push(n.x, n.y, n.z);
              } else {
                keepPos.push(pts[k].x, pts[k].y, pts[k].z);
                if (n) keepNor.push(n.x, n.y, n.z);
              }
            }
          }
          if (!keepPos.length) continue;
          const remnant = new THREE.BufferGeometry();
          remnant.setAttribute('position', new THREE.Float32BufferAttribute(keepPos, 3));
          if (keepNor.length === keepPos.length) {
            remnant.setAttribute('normal', new THREE.Float32BufferAttribute(keepNor, 3));
          } else {
            remnant.computeVertexNormals();
          }
          const shell = new THREE.Mesh(remnant, mesh.material);
          shell.name = mesh.name;
          body.add(shell);
        }

        // Shape pass: the prototype scan names nothing useful, so its wheels are
        // found by shape instead of by name — a round, wheel-sized mesh sitting at
        // a corner. Tyre, rim and brake disc are separate meshes on the same axle,
        // so they are clustered by their y/z centre and moved together.
        const shapeMeshes = [];
        if (CORNERS.some((k) => !buckets[k.key].pos.length)) {
          const meshes = [];
          model.traverse((o) => { if (o.isMesh) meshes.push(o); });
          const bounds = new Map();
          const car = new THREE.Box3();
          const p = new THREE.Vector3();
          for (const mesh of meshes) {
            const box = new THREE.Box3();
            const position = mesh.geometry.getAttribute('position');
            if (!position) continue;
            for (let i = 0; i < position.count; i += 1) box.expandByPoint(p.fromBufferAttribute(position, i).applyMatrix4(mesh.matrixWorld));
            bounds.set(mesh, box);
            car.union(box);
          }
          const carSize = car.getSize(new THREE.Vector3());
          const length = Math.max(carSize.x, carSize.z);
          const width = Math.min(carSize.x, carSize.z);

          const picks = [];
          for (const [mesh, box] of bounds) {
            if (wheelMeshes.includes(mesh)) continue;
            const size = box.getSize(new THREE.Vector3());
            const centre = box.getCenter(new THREE.Vector3());
            const diameter = Math.max(size.y, size.z);
            if (diameter < length * 0.03 || diameter > length * 0.3) continue;
            if (Math.max(size.y, size.z) / Math.max(Math.min(size.y, size.z), 1e-6) > 1.18) continue;
            if (size.x > diameter * 0.9) continue;
            if (Math.abs(centre.x) < width * 0.2 || Math.abs(centre.z) < length * 0.08) continue;
            const position = mesh.geometry.getAttribute('position');
            let radial = 0;
            for (let i = 0; i < position.count; i += 1) {
              p.fromBufferAttribute(position, i).applyMatrix4(mesh.matrixWorld);
              radial = Math.max(radial, Math.hypot(p.y - centre.y, p.z - centre.z));
            }
            if (Math.abs(radial * 2 - diameter) > diameter * 0.2) continue;
            picks.push({ mesh, centre, diameter, width: size.x });
          }

          const clusters = [];
          for (const pick of picks) {
            const corner = CORNERS.find((k) => Math.sign(pick.centre.x) === k.sx && Math.sign(pick.centre.z) === k.sz);
            if (!corner) continue;
            let cluster = clusters.find((cl) => cl.corner === corner.key && Math.hypot(cl.y - pick.centre.y, cl.z - pick.centre.z) < pick.diameter * 0.12);
            if (!cluster) {
              cluster = { corner: corner.key, y: pick.centre.y, z: pick.centre.z, diameter: 0, members: [] };
              clusters.push(cluster);
            }
            cluster.members.push(pick);
            if (pick.diameter > cluster.diameter) {
              cluster.diameter = pick.diameter;
              cluster.y = pick.centre.y;
              cluster.z = pick.centre.z;
            }
          }

          const n = new THREE.Vector3();
          for (const corner of CORNERS) {
            const cluster = clusters.filter((cl) => cl.corner === corner.key).sort((x, y) => y.diameter - x.diameter)[0];
            if (!cluster) continue;
            // the widest part of the cluster is the tyre, and its centre is the axle
            const tyre = cluster.members.reduce((x, y) => (y.width > x.width ? y : x));
            const bucket = buckets[corner.key];
            bucket.centre = tyre.centre.clone();
            for (const pick of cluster.members) {
              const position = pick.mesh.geometry.getAttribute('position');
              const normal = pick.mesh.geometry.getAttribute('normal');
              const index = pick.mesh.geometry.index;
              const count = index ? index.count : position.count;
              for (let t = 0; t + 2 < count; t += 3) {
                for (let k = 0; k < 3; k += 1) {
                  const at = index ? index.getX(t + k) : t + k;
                  p.fromBufferAttribute(position, at).applyMatrix4(pick.mesh.matrixWorld);
                  bucket.pos.push(p.x, p.y, p.z);
                  if (normal) {
                    n.fromBufferAttribute(normal, at).transformDirection(pick.mesh.matrixWorld);
                    bucket.nor.push(n.x, n.y, n.z);
                  }
                }
              }
              if (!shapeMeshes.includes(pick.mesh)) shapeMeshes.push(pick.mesh);
            }
          }
        }

        // Measure one tyre envelope per corner: axle centre, rubber radius and
        // the tyre's own width. Everything below is judged against these.
        const envelopes = [];
        for (const corner of CORNERS) {
          const bucket = buckets[corner.key];
          if (!bucket.pos.length) continue;
          const box = new THREE.Box3();
          const p = new THREE.Vector3();
          for (let i = 0; i < bucket.pos.length; i += 3) box.expandByPoint(p.set(bucket.pos[i], bucket.pos[i + 1], bucket.pos[i + 2]));
          const centre = bucket.centre ? bucket.centre.clone() : box.getCenter(new THREE.Vector3());
          let radius = 0;
          for (let i = 0; i < bucket.pos.length; i += 3) {
            radius = Math.max(radius, Math.hypot(bucket.pos[i + 1] - centre.y, bucket.pos[i + 2] - centre.z));
          }
          envelopes.push({
            key: corner.key,
            centre,
            radius,
            halfWidth: (box.max.x - box.min.x) / 2,
            swept: 0,
          });
        }

        // Envelope sweep: any triangle of the remaining shell whose three corners
        // all sit inside one tyre's volume is part of that wheel (rims, spokes,
        // hub, brake rotor). The envelope is the tyre itself, so the arch lip —
        // measured at ~15% larger radius on the GT — stays with the body. An
        // earlier pass also dropped triangles whose winding faced the axle, but
        // these scans mix windings, so that test left a third of the rim standing
        // still inside the spinning tyre; the radius test alone is the safe cut.
        const sweepMode = ENVELOPE_SWEEP.get(file);
        if (sweepMode && envelopes.length) {
          const meshes = [];
          body.traverse((o) => {
            if (!o.isMesh) return;
            let cur = o.parent;
            while (cur) { if (cur.name?.startsWith('wheel-')) return; cur = cur.parent; }
            meshes.push(o);
          });
          // The shell has not been added to `body` yet, so walk the scan instead.
          meshes.length = 0;
          model.traverse((o) => { if (o.isMesh && !wheelMeshes.includes(o)) meshes.push(o); });

          const p = new THREE.Vector3();
          const n = new THREE.Vector3();
          for (const mesh of meshes) {
            const geometry = mesh.geometry;
            const pos = geometry.getAttribute('position');
            const nor = geometry.getAttribute('normal');
            const index = geometry.index;
            if (!pos) continue;
            const count = index ? index.count : pos.count;
            const world = new Float32Array(count * 3);
            for (let v = 0; v < count; v += 1) {
              const at = index ? index.getX(v) : v;
              p.fromBufferAttribute(pos, at).applyMatrix4(mesh.matrixWorld);
              world[v * 3] = p.x;
              world[v * 3 + 1] = p.y;
              world[v * 3 + 2] = p.z;
            }

            const owners = new Int8Array(count).fill(-1);
            let inside = 0;
            for (let v = 0; v < count; v += 1) {
              const x = world[v * 3];
              const y = world[v * 3 + 1];
              const z = world[v * 3 + 2];
              for (let e = 0; e < envelopes.length; e += 1) {
                const env = envelopes[e];
                if (Math.abs(x - env.centre.x) > env.halfWidth * 1.08 + 0.005) continue;
                if (Math.hypot(y - env.centre.y, z - env.centre.z) > env.radius * 1.02) continue;
                owners[v] = e;
                inside += 1;
                break;
              }
            }
            if (!inside) continue;
            // Whole-part mode: a mesh is only taken when every one of its
            // triangles belongs to a wheel, so nothing is torn in half.
            if (sweepMode === 'whole') {
              let complete = true;
              for (let t = 0; t + 2 < count && complete; t += 3) {
                const own = owners[t];
                if (!(own >= 0 && own === owners[t + 1] && own === owners[t + 2])) complete = false;
              }
              if (!complete) continue;
            }

            const keptPos = [];
            const keptNor = [];
            let moved = 0;
            for (let t = 0; t + 2 < count; t += 3) {
              const own = owners[t];
              const wheel = own >= 0 && own === owners[t + 1] && own === owners[t + 2] ? own : -1;
              if (wheel >= 0) {
                moved += 1;
                envelopes[wheel].swept += 1;
                const bucket = buckets[envelopes[wheel].key];
                for (let k = 0; k < 3; k += 1) {
                  const v = t + k;
                  bucket.pos.push(world[v * 3], world[v * 3 + 1], world[v * 3 + 2]);
                  if (!nor) continue;
                  const at = index ? index.getX(v) : v;
                  n.fromBufferAttribute(nor, at).transformDirection(mesh.matrixWorld);
                  bucket.nor.push(n.x, n.y, n.z);
                }
                continue;
              }
              for (let k = 0; k < 3; k += 1) {
                const v = t + k;
                keptPos.push(world[v * 3], world[v * 3 + 1], world[v * 3 + 2]);
                if (!nor) continue;
                const at = index ? index.getX(v) : v;
                n.fromBufferAttribute(nor, at).transformDirection(mesh.matrixWorld);
                keptNor.push(n.x, n.y, n.z);
              }
            }
            if (!moved) continue;
            mesh.parent?.remove(mesh);
            if (!keptPos.length) continue;
            const remnant = new THREE.BufferGeometry();
            remnant.setAttribute('position', new THREE.Float32BufferAttribute(keptPos, 3));
            if (keptNor.length === keptPos.length) {
              remnant.setAttribute('normal', new THREE.Float32BufferAttribute(keptNor, 3));
            } else {
              remnant.computeVertexNormals();
            }
            const shell = new THREE.Mesh(remnant, mesh.material);
            shell.name = mesh.name;
            body.add(shell);
          }
        }

        // Build the four wheel nodes around the measured axles.
        const stats = [];
        for (const env of envelopes) {
          const bucket = buckets[env.key];
          if (!bucket.pos.length) continue;
          const positions = new Float32Array(bucket.pos.length);
          for (let i = 0; i < bucket.pos.length; i += 3) {
            positions[i] = bucket.pos[i] - env.centre.x;
            positions[i + 1] = bucket.pos[i + 1] - env.centre.y;
            positions[i + 2] = bucket.pos[i + 2] - env.centre.z;
          }
          const geometry = new THREE.BufferGeometry();
          geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
          if (bucket.nor.length === bucket.pos.length) {
            geometry.setAttribute('normal', new THREE.BufferAttribute(new Float32Array(bucket.nor), 3));
          } else {
            geometry.computeVertexNormals();
          }
          const material = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.6, side: THREE.DoubleSide });
          const wheel = new THREE.Mesh(geometry, material);
          const group = new THREE.Group();
          group.name = `wheel-${env.key}`;
          group.position.copy(env.centre);
          group.add(wheel);
          body.add(group);
          let radius = 0;
          for (let i = 0; i < positions.length; i += 3) {
            radius = Math.max(radius, Math.hypot(positions[i + 1], positions[i + 2]));
          }
          stats.push({
            key: env.key,
            tris: bucket.pos.length / 9,
            radius,
            halfWidth: env.halfWidth,
            centre: env.centre.toArray(),
            swept: env.swept,
          });
        }

        // the shell keeps the scan's own transform; wheel groups sit outside it
        body.add(model);
        for (const mesh of [...wheelMeshes, ...shapeMeshes]) mesh.parent?.remove(mesh);
        const strays = [];
        body.traverse((o) => {
          if (!o.isMesh) return;
          let cur = o.parent;
          while (cur) { if (cur.name?.startsWith('wheel-')) return; cur = cur.parent; }
          if (WHEELISH.test(labelOf(o))) strays.push(o);
        });
        for (const m of strays) m.parent?.remove(m);

        const scene = new THREE.Scene();
        scene.add(body);

        // Does the shell still carry geometry inside a wheel envelope?
        const leftover = envelopes.map(() => 0);
        body.traverse((o) => {
          if (!o.isMesh) return;
          let cur = o.parent;
          while (cur) { if (cur.name?.startsWith('wheel-')) return; cur = cur.parent; }
          const pos2 = o.geometry.getAttribute('position');
          const idx2 = o.geometry.index;
          const count2 = idx2 ? idx2.count : pos2.count;
          const p2 = new THREE.Vector3();
          for (let t = 0; t + 2 < count2; t += 3) {
            for (let e = 0; e < envelopes.length; e += 1) {
              const env = envelopes[e];
              let all = true;
              for (let k = 0; k < 3; k += 1) {
                const at = idx2 ? idx2.getX(t + k) : t + k;
                p2.fromBufferAttribute(pos2, at).applyMatrix4(o.matrixWorld);
                if (Math.abs(p2.x - env.centre.x) > env.halfWidth * 1.02) { all = false; break; }
                if (Math.hypot(p2.y - env.centre.y, p2.z - env.centre.z) > env.radius * 0.99) { all = false; break; }
              }
              if (all) leftover[e] += 1;
            }
          }
        });

        const exporter = new GLTFExporter();
        const buffer = await exporter.parseAsync(scene, { binary: true, onlyVisible: true });
        let bodyTris = 0;
        body.traverse((o) => {
          if (!o.isMesh) return;
          let cur = o.parent;
          while (cur) { if (cur.name?.startsWith('wheel-')) return; cur = cur.parent; }
          const pos2 = o.geometry.getAttribute('position');
          bodyTris += (o.geometry.index ? o.geometry.index.count : pos2.count) / 3;
        });
        return { base64: toBase64(buffer), stats, leftover, wheelMeshes: wheelMeshes.length, bodyTris };
      };
      window.__ready = true;
    </script>
  </body>
</html>
