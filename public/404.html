<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Moved — MH Studioz games</title>
    <script>
      // The repository moved from /apex-gp-2026/ to the domain root. Old links
      // land here as a 404 and get forwarded to the matching page.
      (function () {
        var OLD = '/apex-gp-2026';
        var path = location.pathname;
        var lower = path.toLowerCase();
        var target = null;

        if (lower === OLD || lower.indexOf(OLD + '/') === 0) {
          var rest = path.slice(OLD.length) || '/';
          if (rest.indexOf('/games/deep-atlas') === 0) {
            target = '/games/deep-atlas/';
          } else if (rest.indexOf('/games/apex-gp-2026') === 0) {
            target = '/games/apex-gp-2026/';
          } else if (rest.indexOf('/assets/') === 0) {
            target = rest + location.search;
          } else {
            target = '/games/';
          }
        }

        if (target) location.replace(target);
      })();
    </script>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px;
        background: #04070e;
        color: #9fc4d8;
        font: 13px/1.7 ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: 0.08em;
      }
      .wrap {
        max-width: 420px;
      }
      .tag {
        color: #3be3a0;
        font-size: 11px;
        letter-spacing: 0.24em;
        text-transform: uppercase;
      }
      h1 {
        margin: 10px 0 14px;
        color: #eaf6ff;
        font: 700 26px/1.15 system-ui, -apple-system, Segoe UI, sans-serif;
        letter-spacing: 0.01em;
        text-transform: uppercase;
      }
      p {
        margin: 0 0 18px;
      }
      ul {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 8px;
      }
      a {
        color: #7fd4ff;
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }
      li a {
        display: block;
        padding: 12px 14px;
        border: 1px solid rgba(127, 212, 255, 0.22);
        border-radius: 10px;
        background: rgba(127, 212, 255, 0.05);
        color: #eaf6ff;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="tag">MH Studioz · 404</div>
      <h1>This page moved.</h1>
      <p>The games now live at the site root. Pick one:</p>
      <ul>
        <li><a href="/games/">Games shelf</a></li>
        <li><a href="/games/deep-atlas/">Deep Atlas</a></li>
        <li><a href="/games/apex-gp-2026/">GP 2026</a></li>
      </ul>
    </div>
  </body>
</html>
